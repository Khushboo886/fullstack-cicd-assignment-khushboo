services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build: ./backend
    environment:
      - MONGO_URL=mongodb://mongo:27017/appdb
    depends_on:
      - mongo
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data: